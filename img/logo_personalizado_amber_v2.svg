<svg width="400" height="500" viewBox="0 0 400 500" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Plan Personalizado - Ámbar Premium</title>
  <rect width="400" height="500" rx="24" fill="#333333"/>
  <rect width="400" height="500" rx="24" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
  <rect width="400" height="500" rx="24" fill="none" stroke="#F59E0B" stroke-width="8" opacity="0.07"/>

  <!-- Badge más popular -->
  <rect x="130" y="0" width="140" height="28" rx="14" fill="#F59E0B"/>
  <text x="200" y="19" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" letter-spacing="0.1em">MÁS POPULAR</text>

  <text x="200" y="64" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#F59E0B" text-anchor="middle" letter-spacing="0.14em" opacity="0.6">PLAN</text>
  <text x="200" y="96" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#F59E0B" text-anchor="middle">Personalizado</text>

  <!-- Icono laptop + móvil + engranaje -->
  <g transform="translate(200, 200)">
    <rect x="-62" y="-50" width="98" height="68" rx="7" fill="none" stroke="#F59E0B" stroke-width="2.8"/>
    <rect x="-50" y="-40" width="74" height="10" rx="3" fill="#F59E0B" opacity="0.9"/>
    <rect x="-50" y="-24" width="52" height="7" rx="3" fill="#F59E0B" opacity="0.6"/>
    <rect x="-50" y="-12" width="62" height="7" rx="3" fill="#F59E0B" opacity="0.4"/>
    <line x1="-76" y1="20" x2="40" y2="20" stroke="#F59E0B" stroke-width="2.8" stroke-linecap="round"/>
    <rect x="-24" y="18" width="48" height="7" rx="3" fill="#F59E0B" opacity="0.5"/>
    <!-- Móvil -->
    <rect x="44" y="-38" width="28" height="50" rx="6" fill="none" stroke="#F59E0B" stroke-width="2.2"/>
    <circle cx="58" cy="18" r="4" fill="#F59E0B" opacity="0.7"/>
    <!-- Engranaje -->
    <circle cx="66" cy="-54" r="14" fill="none" stroke="#F59E0B" stroke-width="2.2"/>
    <circle cx="66" cy="-54" r="7" fill="#F59E0B" opacity="0.5"/>
    <line x1="66" y1="-70" x2="66" y2="-68" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="66" y1="-40" x2="66" y2="-38" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="50" y1="-54" x2="52" y2="-54" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="80" y1="-54" x2="82" y2="-54" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <rect x="140" y="252" width="120" height="26" rx="13" fill="#F59E0B" opacity="0.15"/>
  <text x="200" y="270" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#F59E0B" text-anchor="middle" letter-spacing="0.06em">Hasta 5 páginas</text>

  <line x1="40" y1="300" x2="360" y2="300" stroke="#F59E0B" stroke-width="0.5" opacity="0.35"/>

  <circle cx="60" cy="328" r="4" fill="#F59E0B"/>
  <text x="76" y="334" font-family="system-ui,sans-serif" font-size="14" fill="#F59E0B" opacity="0.92">Diseño a medida</text>
  <circle cx="60" cy="360" r="4" fill="#F59E0B"/>
  <text x="76" y="366" font-family="system-ui,sans-serif" font-size="14" fill="#F59E0B" opacity="0.92">Multilenguaje</text>
  <circle cx="60" cy="392" r="4" fill="#F59E0B"/>
  <text x="76" y="398" font-family="system-ui,sans-serif" font-size="14" fill="#F59E0B" opacity="0.92">SEO optimizado</text>
  <circle cx="60" cy="424" r="4" fill="#F59E0B"/>
  <text x="76" y="430" font-family="system-ui,sans-serif" font-size="14" fill="#F59E0B" opacity="0.92">CMS integrado</text>
  <circle cx="60" cy="456" r="4" fill="#F59E0B" opacity="0.3"/>
  <text x="76" y="462" font-family="system-ui,sans-serif" font-size="14" fill="#F59E0B" opacity="0.3">Tienda online</text>
</svg>
