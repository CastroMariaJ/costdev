<svg width="400" height="500" viewBox="0 0 400 500" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Plan Premium - Ámbar Premium</title>
  <rect width="400" height="500" rx="24" fill="#333333"/>
  <rect width="400" height="500" rx="24" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.4"/>

  <text x="200" y="64" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#F59E0B" text-anchor="middle" letter-spacing="0.14em" opacity="0.6">PLAN</text>
  <text x="200" y="96" font-family="system-ui,sans-serif" font-size="34" font-weight="700" fill="#F59E0B" text-anchor="middle">Premium</text>

  <!-- Icono laptop + estrella + carrito -->
  <g transform="translate(200, 200)">
    <rect x="-62" y="-48" width="124" height="80" rx="8" fill="none" stroke="#F59E0B" stroke-width="3"/>
    <rect x="-48" y="-36" width="96" height="11" rx="3" fill="#F59E0B" opacity="0.9"/>
    <rect x="-48" y="-20" width="72" height="7" rx="3" fill="#F59E0B" opacity="0.6"/>
    <rect x="-48" y="-8" width="82" height="7" rx="3" fill="#F59E0B" opacity="0.45"/>
    <rect x="-48" y="4" width="56" height="7" rx="3" fill="#F59E0B" opacity="0.3"/>
    <line x1="-76" y1="34" x2="76" y2="34" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <rect x="-28" y="32" width="56" height="8" rx="3" fill="#F59E0B" opacity="0.5"/>
    <!-- Estrella -->
    <polygon points="72,-58 76,-47 88,-47 79,-40 82,-29 72,-36 62,-29 65,-40 56,-47 68,-47" fill="#F59E0B"/>
    <!-- Carrito -->
    <path d="M-88,-50 L-80,-36 L-56,-36 L-59,-24 L-80,-24" stroke="#F59E0B" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-75" cy="-18" r="4" fill="#F59E0B"/>
    <circle cx="-60" cy="-18" r="4" fill="#F59E0B"/>
  </g>

  <rect x="118" y="252" width="164" height="26" rx="13" fill="#F59E0B" opacity="0.12"/>
  <text x="200" y="270" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#F59E0B" text-anchor="middle" letter-spacing="0.06em">Páginas ilimitadas</text>

  <line x1="40" y1="300" x2="360" y2="300" stroke="#F59E0B" stroke-width="0.5" opacity="0.25"/>

  <circle cx="60" cy="328" r="4" fill="#F59E0B"/>
  <text x="76" y="334" font-family="system-ui,sans-serif" font-size="14" fill="#F59E0B" opacity="0.92">Tienda online</text>
  <circle cx="60" cy="360" r="4" fill="#F59E0B"/>
  <text x="76" y="366" font-family="system-ui,sans-serif" font-size="14" fill="#F59E0B" opacity="0.92">Branding completo</text>
  <circle cx="60" cy="392" r="4" fill="#F59E0B"/>
  <text x="76" y="398" font-family="system-ui,sans-serif" font-size="14" fill="#F59E0B" opacity="0.92">SEO + Analytics</text>
  <circle cx="60" cy="424" r="4" fill="#F59E0B"/>
  <text x="76" y="430" font-family="system-ui,sans-serif" font-size="14" fill="#F59E0B" opacity="0.92">Soporte prioritario</text>
  <circle cx="60" cy="456" r="4" fill="#F59E0B"/>
  <text x="76" y="462" font-family="system-ui,sans-serif" font-size="14" fill="#F59E0B" opacity="0.92">Mantenimiento mensual</text>
</svg>
