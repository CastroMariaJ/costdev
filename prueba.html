<!DOCTYPE html>
<html>
<head>
<style>
  /* Estilos básicos para el cuerpo */
  body { font-family: sans-serif; margin: 0; }

  /* Escondemos el checkbox original */
  #menu-toggle { display: none; }

  /* Estilizamos el botón de la hamburguesa (el label) */
  .hamburger-button {
    display: inline-block;
    padding: 15px;
    background: #333;
    color: white;
    cursor: pointer;
    font-size: 24px;
    user-select: none;
  }

  /* Estilos del menú lateral */
  .menu-content {
    display: none; /* Escondido por defecto */
    background-color: #f9f9f9;
    width: 250px;
    box-shadow: 2px 0px 5px rgba(0,0,0,0.2);
    height: 100vh;
    position: absolute;
  }

  .menu-content ul { list-style: none; padding: 0; margin: 0; }
  .menu-content li a {
    display: block;
    padding: 15px;
    text-decoration: none;
    color: #333;
    border-bottom: 1px solid #ddd;
  }

  /* EL TRUCO: Cuando el checkbox está marcado, muestra el menú */
  #menu-toggle:checked ~ .menu-content {
    display: block;
  }
</style>
</head>
<body>

  <!-- El checkbox que guarda el estado (abierto/cerrado) -->
  <input type="checkbox" id="menu-toggle">

  <!-- El botón que el usuario toca -->
  <label for="menu-toggle" class="hamburger-button">☰</label>

  <!-- El contenido del menú -->
  <nav class="menu-content">
    <ul>
      <li><a href="#">🏠 Inicio</a></li>
      <li><a href="#">🚀 Servicios</a></li>
      <li><a href="#">📂 Portafolio</a></li>
      <li><a href="#">📧 Contacto</a></li>
    </ul>
  </nav>

  <main style="padding: 20px;">
    <h1>Contenido de la web</h1>
    <p>Toca el icono de arriba para abrir el menú en tu móvil.</p>
  </main>

</body>
</html>
